name: Develop Release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: develop-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "GOOGLE_WEB_CLIENT_ID is empty. Add the Google Cloud Web OAuth client ID as a secret on the dev environment."
            exit 1
          fi
          # assembleDebug signs with ~/.android/debug.keystore. Runners generate a new
          # one each job, so Google Sign-In fails unless we restore a keystore whose
          # SHA-1 is already on the Android OAuth client.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
          else
            echo "DEBUG_KEYSTORE_BASE64 is unset. This APK will use a one-off debug certificate; Continue with Google will fail until that SHA-1 is registered."
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android \
            | grep -E 'SHA1:|SHA-1:'

      - name: Prepare release info
        id: info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="develop-${{ github.run_number }}"
          APK_NAME="app-develop-${{ github.run_number }}-${SHORT_SHA}.apk"
          mv app/build/outputs/apk/debug/*.apk "$APK_NAME"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.info.outputs.tag }}" "${{ steps.info.outputs.apk }}" \
            --target "${{ github.sha }}" \
            --title "Develop build #${{ github.run_number }} (${{ steps.info.outputs.sha }})" \
            --generate-notes \
            --prerelease