<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open SplitEase</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1e1b4b; background: #e8eafe; }
    a.btn { display: inline-block; margin-top: 1rem; margin-right: 0.75rem; padding: 0.85rem 1.25rem;
      background: #4f46e5; color: #fff; text-decoration: none; border-radius: 12px; font-weight: 600; }
    a.btn-secondary { background: #fff; color: #4f46e5; border: 2px solid #4f46e5; }
    p { line-height: 1.5; }
    .muted { color: #5c5878; }
  </style>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var inviteIdx = parts.indexOf("invite");
      var token = inviteIdx >= 0 ? parts[inviteIdx + 1] : parts[parts.length - 1];
      if (!token) return;

      // Stay on this page if Chrome cannot hand off — do NOT send to Play automatically.
      // (Play details for com.splitease.app shows unrelated apps until we publish.)
      var stayHere = location.href.split("#")[0];
      var customUrl = "splitease://invite/" + encodeURIComponent(token);
      var intentUrl =
        "intent://invite/" + encodeURIComponent(token) +
        "#Intent;scheme=splitease;package=com.splitease.app;" +
        "S.browser_fallback_url=" + encodeURIComponent(stayHere) + ";end";
      var playUrl =
        "https://play.google.com/store/apps/details?id=com.splitease.app&referrer=" +
        encodeURIComponent("invite_token=" + token);

      window.__spliteaseInvite = {
        customUrl: customUrl,
        intentUrl: intentUrl,
        playUrl: playUrl,
      };

      var leftForApp = false;
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") leftForApp = true;
      });
      window.addEventListener("pagehide", function () { leftForApp = true; });

      // Prefer custom scheme (works for sideloaded installs). Intent is a Chrome fallback.
      try { window.location.href = customUrl; } catch (e) {}
      setTimeout(function () {
        if (leftForApp) return;
        try { window.location.href = intentUrl; } catch (e2) {}
      }, 500);
      // No automatic Play Store redirect — user taps "Get it on Google Play" if needed.
    })();
  </script>
</head>
<body>
  <h1>SplitEase</h1>
  <p>Opening the invite in the SplitEase app…</p>
  <p class="muted">If nothing happens, tap <strong>Open in SplitEase</strong>. Use Play only if the app is not installed yet.</p>
  <p>
    <a id="open" class="btn" href="#">Open in SplitEase</a>
    <a id="store" class="btn btn-secondary" href="#">Get it on Google Play</a>
  </p>
  <p class="muted"><a id="custom" href="#">Or try the app link</a></p>
  <script>
    (function () {
      var urls = window.__spliteaseInvite;
      if (!urls) return;
      document.getElementById("open").href = urls.intentUrl;
      document.getElementById("store").href = urls.playUrl;
      document.getElementById("custom").href = urls.customUrl;
    })();
  </script>
</body>
</html>
